version: 1

cases:
  - name: documentation requires approval
    input:
      event: pull_request.opened
      actor: github-copilot[bot]
      changed_files:
        - docs/guide.md
    expect:
      decision: require_approval
      detected_actions:
        - open_pr
        - modify_docs
      risk_level: low

  - name: workflow changes are blocked
    input:
      event: pull_request.opened
      actor: github-copilot[bot]
      changed_files:
        - .github/workflows/release.yml
    expect:
      decision: block
      matched_rules:
        - Block sensitive paths
      risk_level: critical

  - name: dependency changes require approval
    input:
      event: pull_request.opened
      actor: github-copilot[bot]
      changed_files:
        - package.json
    expect:
      decision: require_approval
      matched_rules:
        - Require approval for dependencies
      risk_level: medium
